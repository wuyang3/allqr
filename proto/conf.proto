syntax = "proto2";

package conf;

enum PlannerType {
  EXTENDED_LQR = 0; 
  ITERATIVE_LQR = 1;
}

message ControlBounds {
  repeated double lower_bound = 1;
  repeated double upper_bound = 2;
}

message DeltaControlBounds {
  repeated double lower_bound = 1;
  repeated double upper_bound = 2;
}

message DiagonalMatrix {
  repeated double value = 1;
}

message Vector {
  repeated double value = 1;
}

message LqrPlannerConf {
  optional PlannerType planner_type = 1;
  optional double convergence_relative_tolerance = 2 [default = 1e-3];
  optional double dt = 3 [default = 0.1];
  optional int32 max_iter_inner = 4 [default = 100];
  optional double wheelbase = 5 [default = 2.0];
  optional double lane_width = 6 [default = 3.70];
  optional int32 horizon = 7 [default = 100];
  optional int32 subdivision = 8 [default = 1];
  optional double reference_speed = 9 [default = 10.0];
  optional double initial_position_std = 10 [default = 0.5];
  optional double initial_heading_std = 11 [default = 0.08];
  optional double initial_speed_std = 12 [default = 1.0];
  optional Vector initial_control = 13;
  optional DiagonalMatrix matrix_q = 14;
  optional DiagonalMatrix matrix_q_intermediate = 15;
  optional DiagonalMatrix matrix_r = 16;
  optional ControlBounds control_bounds = 17;
  optional ControlBounds delta_control_bounds = 18;
  optional double lateral_acceleration_bound = 19;
  optional double lateral_distance_bound = 20;

  optional double delta_f_penalty_factor = 21 [default = 1.0];
  optional double delta_f_scale_factor = 22 [default = 1.0];
  optional double acc_penalty_factor = 23 [default = 1.0];
  optional double acc_scale_factor = 24 [default = 1.0];
  optional double delta_control_penalty_factor = 25 [default = 1.0];
  optional double delta_control_scale_factor = 26 [default = 1.0];
  optional double lat_acc_penalty_factor = 27 [default = 1.0];
  optional double lat_acc_scale_factor = 28 [default = 1.0];
  optional double lat_distance_penalty_factor = 29 [default = 1.0];
  optional double lat_distance_scale_factor = 30 [default = 1.0];

  optional bool enable_random_initialization = 31 [default=true];

  optional Vector reference_lines_x = 32;
  optional Vector reference_lines_y = 33;

  optional DiagonalMatrix init_miu = 34;
  optional double phi = 35 [default = 10.0];

  optional double zero_tolerance = 36 [default = 1e-4];
  optional int32 max_iter_outer = 37 [default = 30];
  optional double constraint_tolerance = 38 [default = 1e-5];
  optional double convergence_abs_tolerance = 39 [default = 1e-4];
}
